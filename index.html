<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AudioVibe — Music for everyone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #0b0718; --panel: #151027; --panel2: #1d1633;
      --muted: #a49bb8; --text: #f7f4ff; --yellow: #a8ff00;
      --green: #10b981; --purple: #8b5cf6; --border: rgba(255,255,255,.09);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--text); font-family: Inter, sans-serif;
      background: radial-gradient(circle at 75% 0%, #28164a 0, transparent 34%),
                  radial-gradient(circle at 0% 35%, #102c2b 0, transparent 28%), var(--bg);
      min-height: 100vh; padding-bottom: 112px;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .topbar {
      height: 76px; display: flex; align-items: center; gap: 28px; padding: 0 4%;
      border-bottom: 1px solid var(--border); background: rgba(11,7,24,.82);
      backdrop-filter: blur(18px); position: sticky; top: 0; z-index: 20;
    }
    .logo { font-size: 24px; font-weight: 900; letter-spacing: -1px; white-space: nowrap; }
    .logo span { color: var(--yellow); }
    .search-wrap { flex: 1; max-width: 680px; position: relative; }
    .search-wrap i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--muted); }
    #searchInput {
      width: 100%; border: 1px solid var(--border); outline: none; border-radius: 30px;
      padding: 14px 18px 14px 48px; color: white; background: #1a142b;
    }
    #searchInput:focus { border-color: var(--green); box-shadow: 0 0 0 3px #10b98122; }
    .search-btn, .primary-btn {
      border: 0; border-radius: 25px; padding: 13px 20px; color: #101507;
      background: var(--yellow); font-weight: 800;
    }
    .search-btn:hover, .primary-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .layout { display: grid; grid-template-columns: 220px minmax(0,1fr); gap: 32px; padding: 32px 4%; }
    aside { position: sticky; top: 100px; align-self: start; }
    .nav-title { color: var(--muted); font-size: 11px; letter-spacing: 1.5px; font-weight: 800; margin: 20px 12px 10px; }
    .nav-btn {
      display: flex; gap: 13px; align-items: center; width: 100%; border: 0; color: #c9c1d8;
      background: transparent; padding: 13px 14px; border-radius: 12px; text-align: left; margin: 3px 0;
    }
    .nav-btn i { width: 18px; }
    .nav-btn:hover, .nav-btn.active { background: #a8ff0018; color: var(--yellow); }
    main { min-width: 0; }
    .hero {
      padding: 34px; border: 1px solid var(--border); border-radius: 24px; overflow: hidden;
      background: linear-gradient(115deg, #251644dd, #102c2bdd), radial-gradient(circle at 90% 20%, #a8ff0033, transparent 30%);
      position: relative;
    }
    .eyebrow { color: var(--yellow); text-transform: uppercase; letter-spacing: 2px; font-size: 11px; font-weight: 800; }
    h1 { font-size: clamp(30px,4vw,48px); line-height: 1.08; margin: 12px 0; letter-spacing: -2px; }
    .hero p { color: #c4bdd2; max-width: 560px; line-height: 1.7; }
    .section-head { display: flex; justify-content: space-between; align-items: center; margin: 34px 0 16px; gap: 15px; }
    h2 { margin: 0; font-size: 21px; }
    .muted { color: var(--muted); font-size: 13px; }
    .song-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(165px,1fr)); gap: 18px; }
    .song-card {
      min-width: 0; background: rgba(25,18,43,.82); border: 1px solid var(--border);
      padding: 12px; border-radius: 17px; transition: .2s; cursor: pointer;
    }
    .song-card:hover { transform: translateY(-4px); border-color: #a8ff0066; background: #211936; }
    .cover-wrap { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: #30254a; }
    .cover-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cover-play {
      position: absolute; right: 10px; bottom: 10px; width: 42px; height: 42px; border: 0;
      border-radius: 50%; background: var(--yellow); color: #101507; font-size: 15px;
      box-shadow: 0 5px 20px #0008;
    }
    .song-name { font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 12px 0 5px; }
    .artist-name { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-bottom { display:flex; justify-content:space-between; align-items:center; margin-top:12px; }
    .icon-btn { border:0; color:#c9c1d8; background:transparent; padding:7px; }
    .icon-btn:hover, .icon-btn.liked { color:var(--yellow); }
    .empty { padding: 45px 20px; text-align:center; color:var(--muted); border:1px dashed var(--border); border-radius:18px; }
    .status { margin: 18px 0 0; color: var(--muted); font-size: 13px; min-height: 20px; }
    .player {
      position: fixed; z-index: 30; bottom: 0; left: 0; width: 100%; min-height: 86px;
      background: rgba(18,13,31,.96); border-top: 1px solid var(--border); backdrop-filter: blur(20px);
      display: grid; grid-template-columns: minmax(180px,1fr) minmax(220px,1.4fr) minmax(130px,1fr);
      align-items: center; gap: 20px; padding: 12px 4%;
    }
    .now-playing { display:flex; align-items:center; gap:12px; min-width:0; }
    .now-playing img { width:54px; height:54px; border-radius:9px; object-fit:cover; background:#30254a; }
    .track-info { min-width:0; }
    .track-info strong,.track-info span { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .track-info strong { font-size:13px; } .track-info span { color:var(--muted); font-size:11px; margin-top:5px; }
    .controls { display:flex; flex-direction:column; align-items:center; gap:8px; }
    .control-buttons { display:flex; align-items:center; gap:20px; }
    .control-buttons button { color:white; border:0; background:transparent; font-size:16px; }
    .control-buttons .play-main { width:37px; height:37px; border-radius:50%; color:#111; background:var(--yellow); }
    .progress-row { display:flex; width:100%; align-items:center; gap:9px; color:var(--muted); font-size:10px; }
    input[type=range] { accent-color:var(--yellow); width:100%; cursor:pointer; }
    .player-actions { display:flex; justify-content:flex-end; align-items:center; gap:12px; }
    .volume { width:90px; }
    .modal-backdrop { position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; padding:20px; background:#000a; }
    .modal { width:min(520px,100%); max-height:85vh; overflow:auto; padding:25px; border:1px solid var(--border); border-radius:20px; background:#171128; }
    .modal-head { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .modal h3 { margin:0; }
    .comment-form { display:flex; gap:8px; margin:18px 0; }
    .comment-form input { flex:1; min-width:0; border:1px solid var(--border); border-radius:10px; padding:12px; color:white; background:#0e0a19; outline:none; }
    .comment { border-top:1px solid var(--border); padding:12px 0; color:#ddd6e8; font-size:13px; overflow-wrap:anywhere; }
    .comment small { color:var(--muted); display:block; margin-bottom:5px; }
    .close-btn { border:0; background:transparent; color:white; font-size:20px; }
    @media(max-width:850px) {
      .layout { grid-template-columns:1fr; } aside { position:static; display:flex; gap:7px; overflow:auto; }
      .nav-title { display:none; } .nav-btn { width:auto; white-space:nowrap; }
      .nav-btn i { display:none; } .player { grid-template-columns:1fr 1.2fr; }
      .player-actions { display:none; }
    }
    @media(max-width:560px) {
      .topbar { padding:0 14px; gap:10px; height:66px; flex-wrap:wrap; }
      .logo { font-size:19px; } .search-wrap { max-width:none; }
      .search-btn { padding:11px 13px; }
      .layout { padding:18px 14px; gap:18px; }
      .hero { padding:24px 20px; } .song-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
      .player { padding:10px 12px; grid-template-columns:1fr auto; gap:8px; }
      .controls { align-items:flex-end; } .progress-row { display:none; }
      .control-buttons { gap:12px; } .now-playing img { width:45px;height:45px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="logo">Audio<span>Vibe</span>.</div>
    <div class="search-wrap">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input id="searchInput" type="search" placeholder="Знайти пісню, виконавця або жанр..." autocomplete="off">
    </div>
    <button class="search-btn" id="searchButton">Знайти</button>
  </header>

  <div class="layout">
    <aside>
      <div>
        <div class="nav-title">МЕНЮ</div>
        <button class="nav-btn active" data-view="discover"><i class="fa-solid fa-compass"></i> Відкрити</button>
        <button class="nav-btn" data-view="favorites"><i class="fa-solid fa-heart"></i> Уподобане</button>
      </div>
    </aside>

    <main>
      <section class="hero">
        <div class="eyebrow">Твоя музика. Твій ритм.</div>
        <h1>Знайди свій<br><span style="color:var(--yellow)">AudioVibe.</span></h1>
        <p>Шукай музику незалежних виконавців, відкривай нові треки та створюй власну музичну колекцію.</p>
        <button class="primary-btn" id="discoverButton"><i class="fa-solid fa-headphones"></i> Слухати музику</button>
      </section>

      <div class="section-head">
        <div>
          <h2 id="sectionTitle">Популярні треки</h2>
          <div class="muted" id="sectionSubtitle">Музика з каталогу Jamendo</div>
        </div>
        <span class="muted" id="resultCount"></span>
      </div>
      <section id="songGrid" class="song-grid"></section>
      <div id="status" class="status" role="status"></div>
    </main>
  </div>

  <footer class="player">
    <div class="now-playing">
      <img id="playerCover" alt="Обкладинка треку" src="">
      <div class="track-info">
        <strong id="playerTitle">Нічого не відтворюється</strong>
        <span id="playerArtist">Обери трек у каталозі</span>
      </div>
      <button class="icon-btn" id="playerLike" title="Додати в уподобане"><i class="fa-regular fa-heart"></i></button>
    </div>
    <div class="controls">
      <div class="control-buttons">
        <button id="prevButton" title="Попередній трек"><i class="fa-solid fa-backward-step"></i></button>
        <button class="play-main" id="playButton" title="Відтворити"><i class="fa-solid fa-play"></i></button>
        <button id="nextButton" title="Наступний трек"><i class="fa-solid fa-forward-step"></i></button>
      </div>
      <div class="progress-row">
        <span id="currentTime">0:00</span>
        <input id="progress" type="range" min="0" max="100" value="0">
        <span id="duration">0:00</span>
      </div>
    </div>
    <div class="player-actions">
      <button class="icon-btn" id="shareButton" title="Поділитися"><i class="fa-solid fa-share-nodes"></i></button>
      <button class="icon-btn" id="commentsButton" title="Коментарі"><i class="fa-regular fa-comment"></i></button>
      <i class="fa-solid fa-volume-high muted"></i>
      <input class="volume" id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
    </div>
  </footer>

  <div class="modal-backdrop" id="commentsModal">
    <div class="modal">
      <div class="modal-head">
        <h3>Коментарі до треку</h3>
        <button class="close-btn" id="closeModal" aria-label="Закрити">&times;</button>
      </div>
      <p class="muted" id="commentTrackName"></p>
      <form class="comment-form" id="commentForm">
        <input id="commentInput" maxlength="300" placeholder="Напиши коментар..." required>
        <button class="primary-btn" type="submit">Додати</button>
      </form>
      <div id="commentList"></div>
    </div>
  </div>

  <audio id="audio"></audio>

  <script>
    // Встав сюди свій Jamendo Client ID. Не додавай Client Secret у браузерний код.
    const JAMENDO_CLIENT_ID = "ВСТАВ_СВІЙ_CLIENT_ID";

    const API_URL = "https://api.jamendo.com/v3.0/tracks/";
    const audio = document.getElementById("audio");
    const searchInput = document.getElementById("searchInput");
    const songGrid = document.getElementById("songGrid");
    const statusBox = document.getElementById("status");

    let tracks = [];
    let currentTrack = null;
    let currentView = "discover";
    let searchResults = [];
    let favorites = JSON.parse(localStorage.getItem("audiovibe_favorites") || "[]");

    const fallbackCover = "https://placehold.co/400x400/211936/a8ff00?text=AudioVibe";

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60).toString().padStart(2, "0");
      return `${mins}:${secs}`;
    }

    function setStatus(message) {
      statusBox.textContent = message;
    }

    function getVisibleTracks() {
      return currentView === "favorites"
        ? tracks.filter(track => favorites.includes(String(track.id)))
        : tracks;
    }

    function saveFavorites() {
      localStorage.setItem("audiovibe_favorites", JSON.stringify(favorites));
    }

    function isFavorite(trackId) {
      return favorites.includes(String(trackId));
    }

    function toggleFavorite(trackId) {
      const id = String(trackId);
      if (isFavorite(id)) {
        favorites = favorites.filter(item => item !== id);
      } else {
        favorites.push(id);
      }
      saveFavorites();
      renderTracks();
      updatePlayerLike();
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[char]));
    }

    function renderTracks() {
      const visibleTracks = getVisibleTracks();
      document.getElementById("resultCount").textContent = `${visibleTracks.length} треків`;

      if (!visibleTracks.length) {
        songGrid.innerHTML = `<div class="empty" style="grid-column:1/-1">
          <i class="fa-regular fa-face-frown" style="font-size:30px"></i>
          <p>${currentView === "favorites" ? "Тут поки немає уподобаних треків." : "Нічого не знайдено. Спробуй інший запит."}</p>
        </div>`;
        return;
      }

      songGrid.innerHTML = visibleTracks.map(track => {
        const liked = isFavorite(track.id);
        const cover = track.image || fallbackCover;
        return `<article class="song-card" data-id="${escapeHtml(track.id)}">
          <div class="cover-wrap">
            <img src="${escapeHtml(cover)}" alt="Обкладинка ${escapeHtml(track.name)}" loading="lazy"
                 onerror="this.src='${fallbackCover}'">
            <button class="cover-play" data-action="play" data-id="${escapeHtml(track.id)}" aria-label="Відтворити">
              <i class="fa-solid fa-play"></i>
            </button>
          </div>
          <div class="song-name" title="${escapeHtml(track.name)}">${escapeHtml(track.name)}</div>
          <div class="artist-name">${escapeHtml(track.artist_name)}</div>
          <div class="card-bottom">
            <span class="muted">${formatTime(Number(track.duration))}</span>
            <button class="icon-btn ${liked ? "liked" : ""}" data-action="like" data-id="${escapeHtml(track.id)}"
                    title="Уподобане"><i class="${liked ? "fa-solid" : "fa-regular"} fa-heart"></i></button>
            <button class="icon-btn" data-action="download" data-id="${escapeHtml(track.id)}" title="Завантажити">
              <i class="fa-solid fa-download"></i>
            </button>
          </div>
        </article>`;
      }).join("");
    }

    async function loadTracks(query = "") {
      if (!JAMENDO_CLIENT_ID || JAMENDO_CLIENT_ID === "a13fbfa7") {
        setStatus("Спочатку встав свій Jamendo Client ID у коді.");
        return;
      }

      setStatus("Шукаю музику в Jamendo...");
      songGrid.innerHTML = `<div class="empty" style="grid-column:1/-1"><i class="fa-solid fa-spinner fa-spin"></i><p>Завантаження треків...</p></div>`;

      const params = new URLSearchParams({
        client_id: JAMENDO_CLIENT_ID,
        format: "json",
        limit: "24",
        audioformat: "mp32",
        imagesize: "400",
        include: "musicinfo",
        order: "popularity_total"
      });
      if (query.trim()) params.set("search", query.trim());

      try {
        const response = await fetch(`${API_URL}?${params.toString()}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (data.headers?.status !== "success") {
          throw new Error(data.headers?.error_message || "Jamendo API повернув помилку.");
        }

        tracks = Array.isArray(data.results) ? data.results : [];
        searchResults = tracks;
        currentView = "discover";
        document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.view === "discover"));
        document.getElementById("sectionTitle").textContent = query ? `Результати: ${query}` : "Популярні треки";
        document.getElementById("sectionSubtitle").textContent = "Музика з каталогу Jamendo";
        renderTracks();
        setStatus(tracks.length ? `Знайдено треків: ${tracks.length}` : "За цим запитом треків не знайдено.");
      } catch (error) {
        console.error(error);
        songGrid.innerHTML = `<div class="empty" style="grid-column:1/-1">Не вдалося завантажити музику.</div>`;
        setStatus(`Помилка: ${error.message}. Перевір Client ID та підключення до інтернету.`);
      }
    }

    function playTrack(track) {
      if (!track || !track.audio) {
        setStatus("Для цього треку немає доступного аудіопосилання.");
        return;
      }
      currentTrack = track;
      audio.src = track.audio;
      audio.load();
      document.getElementById("playerCover").src = track.image || fallbackCover;
      document.getElementById("playerTitle").textContent = track.name || "Невідомий трек";
      document.getElementById("playerArtist").textContent = track.artist_name || "Невідомий виконавець";
      updatePlayerLike();
      audio.play().then(() => {
        document.querySelector("#playButton i").className = "fa-solid fa-pause";
        setStatus(`Зараз грає: ${track.name}`);
      }).catch(error => {
        console.error(error);
        setStatus("Не вдалося відтворити трек. Спробуй натиснути Play ще раз.");
      });
    }

    function updatePlayerLike() {
      const button = document.getElementById("playerLike");
      const liked = currentTrack && isFavorite(currentTrack.id);
      button.classList.toggle("liked", Boolean(liked));
      button.innerHTML = `<i class="${liked ? "fa-solid" : "fa-regular"} fa-heart"></i>`;
    }

    function playNext(direction = 1) {
      const list = getVisibleTracks();
      if (!list.length) return;
      let index = currentTrack ? list.findIndex(track => String(track.id) === String(currentTrack.id)) : -1;
      index = (index + direction + list.length) % list.length;
      playTrack(list[index]);
    }

    function downloadTrack(trackId) {
      const track = tracks.find(item => String(item.id) === String(trackId));
      if (!track) return;
      if (!track.audiodownload_allowed || !track.audiodownload) {
        setStatus("Завантаження цього треку не дозволене правами Jamendo. Його можна слухати онлайн.");
        return;
      }
      const link = document.createElement("a");
      link.href = track.audiodownload;
      link.target = "_blank";
      link.rel = "noopener";
      link.download = `${track.artist_name} - ${track.name}.mp3`;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    async function shareCurrentTrack() {
      if (!currentTrack) {
        setStatus("Спочатку обери трек.");
        return;
      }
      const shareData = {
        title: `${currentTrack.name} — ${currentTrack.artist_name}`,
        text: "Послухай цей трек на AudioVibe!",
        url: currentTrack.shareurl || currentTrack.shorturl || window.location.href
      };
      try {
        if (navigator.share) await navigator.share(shareData);
        else if (navigator.clipboard) {
          await navigator.clipboard.writeText(shareData.url);
          setStatus("Посилання скопійовано!");
        } else {
          window.prompt("Скопіюй посилання:", shareData.url);
        }
      } catch (error) {
        if (error.name !== "AbortError") setStatus("Не вдалося поділитися посиланням.");
      }
    }

    function commentsStorageKey() {
      return currentTrack ? `audiovibe_comments_${currentTrack.id}` : "";
    }

    function renderComments() {
      const comments = currentTrack ? JSON.parse(localStorage.getItem(commentsStorageKey()) || "[]") : [];
      document.getElementById("commentTrackName").textContent = currentTrack
        ? `${currentTrack.name} — ${currentTrack.artist_name}` : "";
      document.getElementById("commentList").innerHTML = comments.length
        ? comments.map(comment => `<div class="comment"><small>${escapeHtml(comment.date)}</small>${escapeHtml(comment.text)}</div>`).join("")
        : `<p class="muted">Коментарів ще немає. Будь першим!</p>`;
    }

    document.getElementById("searchButton").addEventListener("click", () => loadTracks(searchInput.value));
    searchInput.addEventListener("keydown", event => {
      if (event.key === "Enter") loadTracks(searchInput.value);
    });
    document.getElementById("discoverButton").addEventListener("click", () => {
      searchInput.value = "";
      loadTracks();
    });

    document.querySelectorAll(".nav-btn").forEach(button => {
      button.addEventListener("click", () => {
        currentView = button.dataset.view;
        document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.toggle("active", btn === button));
        document.getElementById("sectionTitle").textContent = currentView === "favorites" ? "Уподобані треки" : "Популярні треки";
        document.getElementById("sectionSubtitle").textContent = currentView === "favorites" ? "Твоя особиста колекція" : "Музика з каталогу Jamendo";
        renderTracks();
      });
    });

    songGrid.addEventListener("click", event => {
      const button = event.target.closest("button[data-action]");
      if (!button) {
        const card = event.target.closest(".song-card");
        if (card) {
          const track = getVisibleTracks().find(item => String(item.id) === card.dataset.id);
          if (track) playTrack(track);
        }
        return;
      }
      const { action, id } = button.dataset;
      if (action === "play") {
        const track = getVisibleTracks().find(item => String(item.id) === id);
        if (track) playTrack(track);
      } else if (action === "like") {
        toggleFavorite(id);
      } else if (action === "download") {
        downloadTrack(id);
      }
    });

    document.getElementById("playButton").addEventListener("click", () => {
      if (!currentTrack) {
        const first = getVisibleTracks()[0];
        if (first) playTrack(first);
        else setStatus("Спочатку завантаж треки.");
        return;
      }
      if (audio.paused) {
        audio.play().then(() => {
          document.querySelector("#playButton i").className = "fa-solid fa-pause";
        }).catch(() => setStatus("Не вдалося відтворити аудіо."));
      } else {
        audio.pause();
      }
    });
    document.getElementById("prevButton").addEventListener("click", () => playNext(-1));
    document.getElementById("nextButton").addEventListener("click", () => playNext(1));
    document.getElementById("playerLike").addEventListener("click", () => {
      if (currentTrack) toggleFavorite(currentTrack.id);
    });
    document.getElementById("shareButton").addEventListener("click", shareCurrentTrack);
    document.getElementById("commentsButton").addEventListener("click", () => {
      if (!currentTrack) {
        setStatus("Спочатку обери трек, щоб відкрити коментарі.");
        return;
      }
      renderComments();
      document.getElementById("commentsModal").style.display = "flex";
    });
    document.getElementById("closeModal").addEventListener("click", () => {
      document.getElementById("commentsModal").style.display = "none";
    });
    document.getElementById("commentsModal").addEventListener("click", event => {
      if (event.target.id === "commentsModal") event.currentTarget.style.display = "none";
    });
    document.getElementById("commentForm").addEventListener("submit", event => {
      event.preventDefault();
      if (!currentTrack) return;
      const input = document.getElementById("commentInput");
      const text = input.value.trim();
      if (!text) return;
      const comments = JSON.parse(localStorage.getItem(commentsStorageKey()) || "[]");
      comments.unshift({ text, date: new Date().toLocaleString("uk-UA") });
      localStorage.setItem(commentsStorageKey(), JSON.stringify(comments));
      input.value = "";
      renderComments();
    });

    audio.addEventListener("play", () => {
      document.querySelector("#playButton i").className = "fa-solid fa-pause";
    });
    audio.addEventListener("pause", () => {
      document.querySelector("#playButton i").className = "fa-solid fa-play";
    });
    audio.addEventListener("ended", () => playNext(1));
    audio.addEventListener("timeupdate", () => {
      const progress = document.getElementById("progress");
      if (audio.duration) progress.value = (audio.currentTime / audio.duration) * 100;
      document.getElementById("currentTime").textContent = formatTime(audio.currentTime);
    });
    audio.addEventListener("loadedmetadata", () => {
      document.getElementById("duration").textContent = formatTime(audio.duration);
    });
    audio.addEventListener("error", () => setStatus("Помилка аудіо. Можливо, потік тимчасово недоступний."));
    document.getElementById("progress").addEventListener("input", event => {
      if (audio.duration) audio.currentTime = (Number(event.target.value) / 100) * audio.duration;
    });
    document.getElementById("volume").addEventListener("input", event => {
      audio.volume = Number(event.target.value);
    });
    audio.volume = 0.8;

    // Початкове завантаження каталогу
    loadTracks();
  </script>
</body>
</html>
